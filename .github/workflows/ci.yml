# CI 门禁：typecheck + 全量测试 + 构建
# 配合分支保护将本 job 设为 required check（Settings → Branches → master）
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 同一 PR / 分支的新推送取消旧跑，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test + build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # npm test = tsc --noEmit + test:md + test:store + test:perm + test:app
      - name: Typecheck & tests
        run: npm test

      - name: Build
        run: npm run build
